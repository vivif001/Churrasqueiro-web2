<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Churrasqueiro - Painel da Cozinha (KDS)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../shared/css/global.css">
    <link rel="stylesheet" href="pedidos-cozinha.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-container">
        <a href="../cardapio/cardapio.html" class="marca-header">
            <div class="texto-marca">
                <span class="nome-marca">O CHURRASQUEIRO</span>
                <span class="segmento-marca">PAINEL DA COZINHA (KDS)</span>
            </div>
        </a>

        <nav class="nav-links">
            <a href="../cardapio/cardapio.html" class="nav-item">
                <i class="fa-solid fa-burger"></i>
                <span>Cardápio</span>
            </a>
            <a href="../pedidos-cliente/pedidos-cliente.html" class="nav-item">
                <i class="fa-solid fa-bell-concierge"></i>
                <span>Mesas & Pedidos</span>
            </a>
            <a href="pedidos-cozinha.html" class="nav-item active">
                <i class="fa-solid fa-kitchen-set"></i>
                <span>Cozinha (KDS)</span>
            </a>
            <a href="../equipe/equipe.html" class="nav-item">
                <i class="fa-solid fa-users-gear"></i>
                <span>Equipe</span>
            </a>
        </nav>

        <div class="header-acoes-direita">
            <button type="button" class="btn-atualizar" id="btnAtualizarPedidos" title="Atualizar pedidos">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Atualizar</span>
            </button>

            <div class="usuario-painel">
                <div class="usuario-avatar">
                    <i class="fa-solid fa-kitchen-set"></i>
                </div>
                <div class="usuario-detalhes">
                    <span class="usuario-nome" id="usuarioNome">Cozinha</span>
                    <span class="usuario-cargo" id="usuarioCargo">COZINHEIRO</span>
                </div>
                <button type="button" class="btn-logout" id="btnLogout" title="Sair">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </div>
</header>

<main class="main-content">

    <section class="painel-header-info">
        <div class="status-resumo-grid">
            <div class="card-status-resumo resumo-recebidos">
                <span class="resumo-qtd" id="countRecebidos">0</span>
                <span class="resumo-label">Recebidos (Aguardando)</span>
            </div>
            <div class="card-status-resumo resumo-preparo">
                <span class="resumo-qtd" id="countEmPreparo">0</span>
                <span class="resumo-label">Na Chapa (Em Preparo)</span>
            </div>
            <div class="card-status-resumo resumo-prontos">
                <span class="resumo-qtd" id="countProntos">0</span>
                <span class="resumo-label">Prontos para Envio</span>
            </div>
        </div>
    </section>

    <section class="pedidos-cozinha-grid" id="pedidosContainer"></section>

    <div class="estado-vazio" id="estadoVazioCozinha" style="display: none;">
        <i class="fa-solid fa-bell-concierge estado-vazio-icone"></i>
        <h3 class="estado-vazio-titulo">NENHUM PEDIDO PENDENTE</h3>
        <p class="estado-vazio-texto">A chapa está limpa! Novos pedidos realizados no salão aparecerão automaticamente aqui.</p>
    </div>

</main>

<script src="../shared/js/auth.js"></script>
<script src="pedidos-cozinha-service.js"></script>
<script src="pedidos-cozinha.js"></script>
</body>
</html>
