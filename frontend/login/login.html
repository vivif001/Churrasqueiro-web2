<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Churrasqueiro - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">
  <div class="secao-marca">
    <div class="caixa-logo">
      <img src="../shared/assets/logo.png" alt="" class="logo-marca" onerror="this.style.display='none';">
    </div>
    <h1 class="titulo-marca">O CHURRASQUEIRO</h1>
    <p class="subtitulo-marca">Hamburgueria artesanal</p>
  </div>

  <div class="secao-formulario">
    <h2 class="titulo-formulario">ACESSE SUA CONTA</h2>
    <p class="subtitulo-formulario">Faça login para gerenciar o cardápio e pedidos</p>

    <div id="errorAlert" class="alerta alerta-erro" style="display: none;"></div>

    <form id="loginForm" class="formulario-login">
      <div class="input-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required autocomplete="username">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <div class="caixa-senha">
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password">
          <button type="button" class="alternar-senha" id="togglePassword" aria-label="Mostrar senha">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="botao-enviar">ENTRAR</button>

        <div style="margin-top: 14px; background: #18181b; border: 1px dashed #3f3f46; border-radius: 8px; padding: 12px; font-size: 0.8rem; color: #a1a1aa; text-align: left;">
          <div style="font-weight: 600; color: #f4f4f5; margin-bottom: 6px;">💡 Contas do Sistema:</div>
          <div style="display: flex; flex-direction: column; gap: 4px; line-height: 1.4;">
            <span>👑 <strong>Admin:</strong> <code>admin@hamburgueria.com</code> | <code>admin123</code></span>
            <span>🍽️ <strong>Garçom:</strong> <code>garcom@hamburgueria.com</code> | <code>garcom123</code></span>
            <span>🍳 <strong>Cozinha:</strong> <code>cozinheiro@hamburgueria.com</code> | <code>chapa123</code></span>
          </div>
        </div>

        <div style="margin-top: 14px; border-top: 1px solid #27272a; padding-top: 14px;">
          <a href="../cardapio/cardapio.html" class="esqueceu-senha-link" style="color: #ffffff; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Cardápio (Cliente)
          </a>
        </div>
    </form>
  </div>
</div>

<script src="../shared/js/auth.js"></script>
<script src="login.service.js"></script>
<script src="login.js"></script>
</body>
</html>
